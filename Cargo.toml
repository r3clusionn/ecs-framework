[package]
name = "tessera"
version = "0.1.0"
edition = "2021"
description = "An entity component system: archetype storage, cached queries with change detection, systems scheduled in parallel from their declared access."
license = "MIT"

[dependencies]
workpool = { git = "https://github.com/r3clusionn/thread-pool-library", rev = "35ee663" }

[profile.release]
debug = false

[dev-dependencies]
hecs = "0.10"
benchlab = { git = "https://github.com/r3clusionn/bench-framework", rev = "390a6b4" }

[[bench]]
name = "ecs"
harness = false
